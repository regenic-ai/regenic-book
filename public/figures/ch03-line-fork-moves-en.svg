<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img">
  <rect width="900" height="500" fill="#fff"/>
  <text x="450" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">Line and fork / four moves of adaptive insight</text>
  <text x="200" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59615a">With a standard: nearly a line</text>
  <circle cx="80" cy="180" r="10" fill="#2d7a25"/>
  <line x1="90" y1="180" x2="320" y2="180" stroke="#2d7a25" stroke-width="3"/>
  <circle cx="320" cy="180" r="10" fill="#2d7a25"/>
  <text x="200" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Act by the standard / feedback / tweak</text>
  <text x="650" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59615a">No standard: a forked web</text>
  <circle cx="520" cy="180" r="10" fill="#2d7a25"/>
  <line x1="530" y1="180" x2="620" y2="180" stroke="#2d7a25" stroke-width="3"/>
  <line x1="620" y1="180" x2="780" y2="100" stroke="#d5dbd6" stroke-width="2"/>
  <line x1="620" y1="180" x2="780" y2="180" stroke="#2d7a25" stroke-width="3"/>
  <line x1="620" y1="180" x2="780" y2="260" stroke="#d5dbd6" stroke-width="2"/>
  <line x1="700" y1="140" x2="760" y2="120" stroke="#d5dbd6" stroke-width="1.5"/>
  <line x1="700" y1="220" x2="760" y2="250" stroke="#d5dbd6" stroke-width="1.5"/>
  <circle cx="780" cy="100" r="7" fill="#d5dbd6"/>
  <circle cx="780" cy="180" r="10" fill="#2d7a25"/>
  <circle cx="780" cy="260" r="7" fill="#d5dbd6"/>
  <text x="650" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Every decision forks again</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="340" width="200" height="110" rx="8" fill="#6bed4a" fill-opacity="0.12" stroke="#2d7a25"/>
    <text x="130" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">1 Discover the gap</text>
    <text x="130" y="410" text-anchor="middle" font-size="11" fill="#59615a">Am I in a fork map?</text>
    <rect x="250" y="340" width="200" height="110" rx="8" fill="#6bed4a" fill-opacity="0.12" stroke="#2d7a25"/>
    <text x="350" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">2 Borrow a standard</text>
    <text x="350" y="410" text-anchor="middle" font-size="11" fill="#59615a">Who already did this?</text>
    <rect x="470" y="340" width="200" height="110" rx="8" fill="#6bed4a" fill-opacity="0.12" stroke="#2d7a25"/>
    <text x="570" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">3 Judge migration</text>
    <text x="570" y="410" text-anchor="middle" font-size="11" fill="#59615a">Do the conditions still hold?</text>
    <rect x="690" y="340" width="180" height="110" rx="8" fill="#6bed4a" fill-opacity="0.12" stroke="#2d7a25"/>
    <text x="780" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">4 Verify and correct</text>
    <text x="780" y="410" text-anchor="middle" font-size="11" fill="#59615a">Expose error while it is cheap</text>
  </g>
  <text x="450" y="485" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">A standard narrows options; it does not guarantee a correct result</text>
</svg>

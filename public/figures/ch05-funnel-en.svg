<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <rect width="720" height="420" fill="#fff"/>
  <text x="360" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">Scarcity funnel</text>
  <polygon points="80,70 640,70 520,160 200,160" fill="#6bed4a" fill-opacity="0.1" stroke="#d5dbd6"/>
  <text x="360" y="125" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a0a0a">Money · once scarce</text>
  <polygon points="200,180 520,180 440,260 280,260" fill="#6bed4a" fill-opacity="0.18" stroke="#d5dbd6"/>
  <text x="360" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a0a0a">Time · then scarce</text>

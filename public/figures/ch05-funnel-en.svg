<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Money, time, and reliable judgment as a resource-allocation loop</title>
  <desc id="desc">The company spends money to buy a person's time; time carries reliable judgment; judgment decides the next round of money and time. The current bottleneck migrates with the stage. Allocation first clears legal, integrity, safety, and survival baselines, then compares value with full cost.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d7a25"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">Three-layer resource-allocation loop</text>
  <text x="460" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Three levels of analysis / not three permanent identities</text>

  <rect x="280" y="78" width="360" height="38" rx="19" fill="#ffffff" stroke="#2d7a25" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="102" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d7a25">The current bottleneck migrates with the stage</text>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="50" y="150" width="210" height="138" rx="14" fill="#f5fff2" stroke="#b8f3a6" stroke-width="1.5"/>
    <text x="155" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">Company / money</text>
    <text x="155" y="226" text-anchor="middle" font-size="13" fill="#59615a">How much can still go in</text>
    <text x="155" y="249" text-anchor="middle" font-size="13" fill="#59615a">How many failed tries it can bear</text>

    <rect x="355" y="150" width="210" height="138" rx="14" fill="#fff8ef" stroke="#ead8bd" stroke-width="1.5"/>
    <text x="460" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">Person / time</text>
    <text x="460" y="226" text-anchor="middle" font-size="13" fill="#59615a">A non-renewable outlay</text>
    <text x="460" y="249" text-anchor="middle" font-size="13" fill="#59615a">Carries action and judgment</text>

    <rect x="660" y="150" width="210" height="138" rx="14" fill="#f7f3ff" stroke="#cdbce8" stroke-width="1.5"/>
    <text x="765" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a">AI-native organization</text>
    <text x="765" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#2d7a25">Reliable judgment</text>
    <text x="765" y="246" text-anchor="middle" font-size="13" fill="#59615a">Decides where resources go</text>
  </g>

  <line x1="260" y1="219" x2="345" y2="219" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="205" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Buys</text>
  <line x1="565" y1="219" x2="650" y2="219" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="607" y="205" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Carries</text>

  <path d="M765,288 C765,368 155,368 155,298" fill="none" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2d7a25">Judgment sets the next flow of money and time</text>

  <rect x="55" y="408" width="390" height="62" rx="12" fill="#ffffff" stroke="#d5dbd6"/>
  <text x="250" y="434" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">First the baseline</text>
  <text x="250" y="456" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Legal / integrity / safety / survival</text>

  <rect x="475" y="408" width="390" height="62" rx="12" fill="#f5fff2" stroke="#b8f3a6"/>
  <text x="670" y="434" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">Then compare return</text>
  <text x="670" y="456" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2d7a25">Verifiable total value &#247; full cost &gt; 1</text>
</svg>

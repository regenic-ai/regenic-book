<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">The standards cycle</title>
  <desc id="desc">Judgment is distilled into a standard, issued and executed, then results return and the standard is revised. Before issuing, check whether the standard is usable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7a25"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0a0a0a">The standards cycle</text>
    <text x="450" y="64" text-anchor="middle" font-size="13" fill="#59615a">Judgment becomes reusable only after it is written, executed, fed back, and revised</text>

    <g fill="none" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 220 161 C 250 130, 280 112, 315 107"/>
      <path d="M 445 107 L 493 107"/>
      <path d="M 565 140 L 565 189"/>
      <path d="M 620 251 C 656 245, 680 231, 704 224"/>
      <path d="M 770 245 L 770 307"/>
      <path d="M 715 365 C 681 398, 646 419, 602 428"/>
      <path d="M 472 428 L 424 428"/>
      <path d="M 294 424 C 230 410, 176 371, 148 314 C 120 258, 128 207, 164 171"/>
    </g>

    <g>
      <rect x="95" y="120" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="160" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Judgment</text>

      <rect x="315" y="79" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="380" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Distill</text>

      <rect x="493" y="74" width="145" height="66" rx="8" fill="#2d7a25" fill-opacity="0.16" stroke="#2d7a25" stroke-width="2"/>
      <text x="565.5" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#2d7a25">Form the standard</text>
      <text x="565.5" y="122" text-anchor="middle" font-size="10" fill="#59615a">Use / act / evidence / stop / revise</text>

      <rect x="705" y="195" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="770" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Issue</text>

      <rect x="705" y="307" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="770" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Execute</text>

      <rect x="472" y="400" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="537" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Return</text>

      <rect x="294" y="396" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="359" y="429" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Iterate</text>
    </g>

    <g>
      <rect x="250" y="190" width="400" height="142" rx="10" fill="#f5f7f5" stroke="#d5dbd6" stroke-width="1.5"/>
      <text x="450" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">Before issuing: is the standard usable?</text>
      <line x1="280" y1="235" x2="620" y2="235" stroke="#d5dbd6"/>
      <text x="300" y="263" font-size="13" font-weight="700" fill="#2d7a25">Yes</text>
      <text x="345" y="263" font-size="13" fill="#0a0a0a">Issue and execute</text>
      <text x="300" y="293" font-size="13" font-weight="700" fill="#9b3d2c">No</text>
      <text x="345" y="293" font-size="13" fill="#0a0a0a">Stop expanding execution; find, borrow, or verify</text>
    </g>

    <rect x="90" y="492" width="720" height="38" rx="6" fill="#2d7a25" fill-opacity="0.06" stroke="#d5dbd6"/>
    <text x="450" y="516" text-anchor="middle" font-size="12" fill="#59615a">Operating conditions: trigger / named owner / fixed feedback record / versioned release</text>
  </g>
</svg>

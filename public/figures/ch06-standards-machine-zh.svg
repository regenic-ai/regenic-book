<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">标准循环</title>
  <desc id="desc">判断经过提炼形成标准，下发执行后让结果回流并迭代；下发前检查标准是否可用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7a25"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fff"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0a0a0a">标准循环</text>
    <text x="450" y="64" text-anchor="middle" font-size="13" fill="#59615a">判断被写下、执行、反馈和修订，才会成为可复用的组织能力</text>

    <g fill="none" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 220 161 C 250 130, 280 112, 315 107"/>
      <path d="M 445 107 L 493 107"/>
      <path d="M 565 140 L 565 189"/>
      <path d="M 620 251 C 656 245, 680 231, 704 224"/>
      <path d="M 770 245 L 770 307"/>
      <path d="M 715 365 C 681 398, 646 419, 602 428"/>
      <path d="M 472 428 L 424 428"/>
      <path d="M 294 424 C 230 410, 176 371, 148 314 C 120 258, 128 207, 164 171"/>
    </g>

    <g>
      <rect x="95" y="120" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="160" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">判断</text>

      <rect x="315" y="79" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="380" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">提炼</text>

      <rect x="493" y="74" width="145" height="66" rx="8" fill="#2d7a25" fill-opacity="0.16" stroke="#2d7a25" stroke-width="2"/>
      <text x="565.5" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">形成标准</text>
      <text x="565.5" y="122" text-anchor="middle" font-size="10.5" fill="#59615a">条件 · 动作 · 证据 · 停止 · 修订</text>

      <rect x="705" y="195" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="770" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">下发</text>

      <rect x="705" y="307" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="770" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">执行</text>

      <rect x="472" y="400" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="537" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">回流</text>

      <rect x="294" y="396" width="130" height="56" rx="8" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>
      <text x="359" y="429" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">迭代</text>
    </g>

    <g>
      <rect x="280" y="190" width="340" height="142" rx="10" fill="#f5f7f5" stroke="#d5dbd6" stroke-width="1.5"/>
      <text x="450" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">下发前检查：标准是否可用？</text>
      <line x1="310" y1="235" x2="590" y2="235" stroke="#d5dbd6"/>
      <text x="330" y="263" font-size="13" font-weight="700" fill="#2d7a25">是</text>
      <text x="370" y="263" font-size="13" fill="#0a0a0a">进入下发与执行</text>
      <text x="330" y="293" font-size="13" font-weight="700" fill="#9b3d2c">否</text>
      <text x="370" y="293" font-size="13" fill="#0a0a0a">停止扩大执行，转入寻找、借用或验证</text>
    </g>

    <rect x="138" y="492" width="624" height="38" rx="6" fill="#2d7a25" fill-opacity="0.06" stroke="#d5dbd6"/>
    <text x="450" y="516" text-anchor="middle" font-size="12.5" fill="#59615a">运行条件：触发条件 · 明确负责人 · 固定反馈记录 · 版本化修订发布</text>
  </g>
</svg>

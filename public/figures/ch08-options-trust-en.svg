<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Interference Method three steps, five result checks, and four Treat People with Honesty rails</title>
  <desc id="desc">Top: analyze existing consensus, find a suitable scene, and form new consensus as a 10/10/80 resource principle. Middle: attention, understanding, trust, persuasion, and consensus checked separately. Bottom: claims can be checked, no material omission, promises can be kept, informed choice remains.</desc>
  <rect width="1000" height="560" fill="#fff"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0a0a0a">Interference Method: help the other party make an informed choice</text>
    <text x="500" y="61" text-anchor="middle" font-size="12" fill="#59615a">10/10/80 marks where the weight of resource goes, not a precise statistical ratio</text>

    <rect x="50" y="88" width="190" height="108" rx="8" fill="#6bed4a" fill-opacity="0.08" stroke="#d5dbd6"/>
    <text x="145" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Existing consensus / 10</text>
    <text x="145" y="145" text-anchor="middle" font-size="11" fill="#59615a">How do they name the problem?</text>
    <text x="145" y="166" text-anchor="middle" font-size="11" fill="#59615a">On what standard do they compare?</text>
    <text x="145" y="187" text-anchor="middle" font-size="11" fill="#59615a">What fact would change the choice?</text>

    <path d="M248 142 H298" stroke="#2d7a25" stroke-width="2" fill="none"/>
    <path d="M292 136 L300 142 L292 148" stroke="#2d7a25" stroke-width="2" fill="none"/>

    <rect x="310" y="88" width="190" height="108" rx="8" fill="#6bed4a" fill-opacity="0.12" stroke="#d5dbd6"/>
    <text x="405" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Suitable scene / 10</text>
    <text x="405" y="145" text-anchor="middle" font-size="11" fill="#59615a">Who speaks, and when?</text>
    <text x="405" y="166" text-anchor="middle" font-size="11" fill="#59615a">In what form of evidence?</text>
    <text x="405" y="187" text-anchor="middle" font-size="11" fill="#59615a">Are comparison conditions aligned?</text>

    <path d="M508 142 H558" stroke="#2d7a25" stroke-width="2" fill="none"/>
    <path d="M552 136 L560 142 L552 148" stroke="#2d7a25" stroke-width="2" fill="none"/>

    <rect x="570" y="88" width="380" height="108" rx="8" fill="#2d7a25" fill-opacity="0.12" stroke="#2d7a25" stroke-width="2"/>
    <text x="760" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Form new consensus / 80</text>
    <text x="760" y="145" text-anchor="middle" font-size="11" fill="#59615a">State the claim, give the basis, allow a check</text>
    <text x="760" y="166" text-anchor="middle" font-size="11" fill="#59615a">Watch actual understanding; revise with use and feedback</text>
    <text x="760" y="187" text-anchor="middle" font-size="11" fill="#59615a">The other party and reality keep a veto</text>

    <text x="500" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">Check five results separately; they are not a necessary funnel</text>

    <rect x="50" y="258" width="164" height="70" rx="7" fill="#f7f8f7" stroke="#d5dbd6"/>
    <text x="132" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Attention</text>
    <text x="132" y="307" text-anchor="middle" font-size="11" fill="#59615a">Did they stop and process?</text>

    <rect x="234" y="258" width="164" height="70" rx="7" fill="#f7f8f7" stroke="#d5dbd6"/>
    <text x="316" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Understanding</text>
    <text x="316" y="307" text-anchor="middle" font-size="11" fill="#59615a">Can they restate conditions and cost?</text>

    <rect x="418" y="258" width="164" height="70" rx="7" fill="#f7f8f7" stroke="#d5dbd6"/>
    <text x="500" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Trust</text>
    <text x="500" y="307" text-anchor="middle" font-size="11" fill="#59615a">Did they act on the evidence?</text>

    <rect x="602" y="258" width="164" height="70" rx="7" fill="#f7f8f7" stroke="#d5dbd6"/>
    <text x="684" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Persuasion</text>
    <text x="684" y="307" text-anchor="middle" font-size="11" fill="#59615a">Did choice or commitment change?</text>

    <rect x="786" y="258" width="164" height="70" rx="7" fill="#f7f8f7" stroke="#d5dbd6"/>
    <text x="868" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Consensus</text>
    <text x="868" y="307" text-anchor="middle" font-size="11" fill="#59615a">Does a group reuse the same standard?</text>

    <rect x="50" y="372" width="900" height="132" rx="9" fill="#6bed4a" fill-opacity="0.08" stroke="#2d7a25" stroke-width="2"/>
    <text x="500" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#2d7a25">Treat People with Honesty constrains the whole process</text>

    <line x1="275" y1="422" x2="275" y2="482" stroke="#d5dbd6"/>
    <line x1="500" y1="422" x2="500" y2="482" stroke="#d5dbd6"/>
    <line x1="725" y1="422" x2="725" y2="482" stroke="#d5dbd6"/>

    <text x="162" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Claims can be checked</text>
    <text x="162" y="470" text-anchor="middle" font-size="11" fill="#59615a">Source, definition, and conditions can be traced</text>

    <text x="387" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">No material omission</text>
    <text x="387" y="470" text-anchor="middle" font-size="11" fill="#59615a">Disclose facts that could change the choice</text>

    <text x="612" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Promises can be kept</text>
    <text x="612" y="470" text-anchor="middle" font-size="11" fill="#59615a">Write limits, uncertainty, and the stop line</text>

    <text x="837" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Informed choice remains</text>
    <text x="837" y="470" text-anchor="middle" font-size="11" fill="#59615a">They can compare, refuse, and leave</text>

    <text x="500" y="538" text-anchor="middle" font-size="12" fill="#59615a">Narrow the cost of understanding and comparison; do not take away the other party's right to choose</text>
  </g>
</svg>

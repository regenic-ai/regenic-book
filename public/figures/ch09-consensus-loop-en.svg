<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">One cycle, enlarged layer by layer</title>
  <desc id="desc">Judgment, distill, form the standard, issue, execute, return, and iterate are one cycle. In a person it is called adaptive insight; in a team, the standards cycle; company-wide, the consensus cycle; outside the organization, cultural spillover.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7a25"/>
    </marker>
  </defs>

  <rect width="920" height="650" fill="#fff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0a0a0a">One cycle, enlarged layer by layer</text>
    <text x="460" y="64" text-anchor="middle" font-size="13" fill="#59615a">The moves do not change; the range of use expands from a person to outside the organization</text>

    <rect x="70" y="92" width="780" height="410" rx="28" fill="#2d7a25" fill-opacity="0.035" stroke="#2d7a25" stroke-width="2"/>
    <rect x="150" y="142" width="620" height="310" rx="24" fill="#2d7a25" fill-opacity="0.045" stroke="#2d7a25" stroke-width="2"/>
    <rect x="230" y="192" width="460" height="210" rx="20" fill="#2d7a25" fill-opacity="0.06" stroke="#2d7a25" stroke-width="2"/>
    <rect x="310" y="235" width="300" height="140" rx="16" fill="#2d7a25" fill-opacity="0.10" stroke="#2d7a25" stroke-width="2"/>

    <rect x="88" y="107" width="250" height="30" rx="15" fill="#fff"/>
    <text x="213" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Cultural spillover | outside</text>

    <rect x="168" y="157" width="250" height="30" rx="15" fill="#fff"/>
    <text x="293" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Consensus cycle | company-wide</text>

    <rect x="248" y="207" width="200" height="30" rx="15" fill="#fff"/>
    <text x="348" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Standards cycle | team</text>

    <rect x="328" y="257" width="210" height="30" rx="15" fill="#fff"/>
    <text x="433" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Adaptive insight | person</text>

    <ellipse cx="460" cy="320" rx="128" ry="58" fill="none" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="338" y="292" width="244" height="55" rx="9" fill="#fff" stroke="#d5dbd6" stroke-width="1.5"/>
    <text x="460" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Judgment &#8594; Distill &#8594; Form the standard</text>
    <text x="460" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Issue &#8594; Execute &#8594; Return &#8594; Iterate</text>

    <rect x="96" y="385" width="256" height="58" rx="8" fill="#fff" stroke="#d5dbd6" stroke-width="1.5"/>
    <text x="224" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Clarity Method</text>
    <text x="224" y="429" text-anchor="middle" font-size="12" fill="#59615a">Find, borrow, and verify standards</text>

    <rect x="568" y="385" width="256" height="58" rx="8" fill="#fff" stroke="#d5dbd6" stroke-width="1.5"/>
    <text x="696" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">Interference Method</text>
    <text x="696" y="429" text-anchor="middle" font-size="12" fill="#59615a">Let a true judgment be understood and adopted</text>

    <path d="M352 414 C385 398, 404 372, 418 348" fill="none" stroke="#2d7a25" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M568 414 C535 398, 516 372, 502 348" fill="none" stroke="#2d7a25" stroke-width="1.7" marker-end="url(#arrow)"/>

    <rect x="80" y="544" width="760" height="58" rx="9" fill="#2d7a25" fill-opacity="0.06" stroke="#d5dbd6"/>
    <text x="460" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Consensus: shared judgment standards, decision-relevant facts, and action commitments</text>
    <text x="460" y="590" text-anchor="middle" font-size="12" fill="#59615a">Known disagreements stay in the record; unified context is not a unified view or a dump of all information</text>
  </g>
</svg>

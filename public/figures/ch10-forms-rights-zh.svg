<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">人才结构的动态生命周期</title>
  <desc id="desc">先定位岗位任务与人的判断证据，再定位组织需要，最后匹配 AI、外包、保留人工、培养、筛选与五级决策权；结果持续回流。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2d7a25"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#fff"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0a0a0a">人才结构的动态生命周期</text>
    <text x="460" y="57" text-anchor="middle" font-size="12" fill="#59615a">S 级标任务；决策权标具体任务中的权限</text>

    <rect x="35" y="88" width="250" height="255" rx="8" fill="#6bed4a" fill-opacity="0.07" stroke="#d5dbd6"/>
    <text x="160" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a">1　定位岗位与人 · 10</text>
    <text x="58" y="157" font-size="12" fill="#59615a">岗位拆成真实任务</text>
    <line x1="58" y1="170" x2="260" y2="170" stroke="#d5dbd6"/>
    <rect x="58" y="190" width="58" height="38" rx="5" fill="#fff" stroke="#d5dbd6"/>
    <rect x="131" y="190" width="58" height="38" rx="5" fill="#fff" stroke="#d5dbd6"/>
    <rect x="204" y="190" width="58" height="38" rx="5" fill="#fff" stroke="#d5dbd6"/>
    <text x="87" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">S1</text>
    <text x="87" y="221" text-anchor="middle" font-size="10" fill="#59615a">明确指令</text>
    <text x="160" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">S2</text>
    <text x="160" y="221" text-anchor="middle" font-size="10" fill="#59615a">成熟标准</text>
    <text x="233" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">S3</text>
    <text x="233" y="221" text-anchor="middle" font-size="10" fill="#59615a">例外取舍</text>
    <text x="58" y="261" font-size="12" fill="#59615a">人：记录具体任务上的判断证据</text>
    <text x="58" y="287" font-size="11" fill="#59615a">标准理解 · 例外处理 · 风险暴露</text>
    <text x="58" y="311" font-size="11" fill="#59615a">结果质量 · 修订能力</text>

    <line x1="293" y1="216" x2="327" y2="216" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="335" y="88" width="250" height="255" rx="8" fill="#6bed4a" fill-opacity="0.11" stroke="#d5dbd6"/>
    <text x="460" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a">2　定位组织需要 · 10</text>
    <text x="360" y="158" font-size="12" fill="#59615a">结果与任务量</text>
    <text x="360" y="188" font-size="12" fill="#59615a">长期核心与阶段高峰</text>
    <text x="360" y="218" font-size="12" fill="#59615a">标准与上下文准备度</text>
    <text x="360" y="248" font-size="12" fill="#59615a">物理执行与现场感知</text>
    <text x="360" y="278" font-size="12" fill="#59615a">监管 · 隐私 · 安全 · 信任</text>
    <text x="360" y="308" font-size="12" fill="#59615a">最终问责与风险承受</text>

    <line x1="593" y1="216" x2="627" y2="216" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="635" y="88" width="250" height="255" rx="8" fill="#6bed4a" fill-opacity="0.16" stroke="#2d7a25" stroke-width="1.5"/>
    <text x="760" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a">3　匹配与取舍 · 80</text>
    <text x="660" y="158" font-size="12" fill="#59615a">AI 小试 · 外包小试 · 保留人工</text>
    <text x="660" y="188" font-size="12" fill="#59615a">培养 · 筛选 · 重新配置</text>
    <text x="660" y="218" font-size="12" fill="#59615a">为保留在人手里的任务配置决策权</text>
    <rect x="658" y="243" width="40" height="42" rx="4" fill="#fff" stroke="#d5dbd6"/>
    <rect x="705" y="243" width="40" height="42" rx="4" fill="#fff" stroke="#d5dbd6"/>
    <rect x="752" y="243" width="40" height="42" rx="4" fill="#fff" stroke="#d5dbd6"/>
    <rect x="799" y="243" width="40" height="42" rx="4" fill="#fff" stroke="#d5dbd6"/>
    <rect x="846" y="243" width="40" height="42" rx="4" fill="#fff" stroke="#2d7a25"/>
    <text x="678" y="269" text-anchor="middle" font-size="10" fill="#0a0a0a">指示</text>
    <text x="725" y="269" text-anchor="middle" font-size="10" fill="#0a0a0a">指导</text>
    <text x="772" y="269" text-anchor="middle" font-size="10" fill="#0a0a0a">协商</text>
    <text x="819" y="269" text-anchor="middle" font-size="10" fill="#0a0a0a">授权</text>
    <text x="866" y="269" text-anchor="middle" font-size="10" fill="#0a0a0a">放权</text>
    <text x="660" y="316" font-size="11" fill="#59615a">范围 · 风险上限 · 有效期 · 升级与撤回</text>

    <path d="M760 357 C760 455 160 455 160 357" fill="none" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="460" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a25">结果、例外与能力变化持续回流</text>
    <text x="460" y="427" text-anchor="middle" font-size="11" fill="#59615a">重标任务 · 修订标准 · 调整匹配 · 迁移或回收决策权</text>

    <rect x="125" y="466" width="670" height="58" rx="6" fill="#f7f9f7" stroke="#d5dbd6"/>
    <text x="460" y="491" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">10 / 10 / 80 是资源重心，不是统计比例或人员阈值</text>
    <text x="460" y="512" text-anchor="middle" font-size="11" fill="#59615a">高风险、强监管与不可逆任务可以增加前置判断、证据与复核投入</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Locate first, then match the mix, then run the cycle</title>
  <desc id="desc">Judge whether the organization is in survival, growth, or a stable stage; then whether the job is mainly delivery, coordination, or judgment; then match short-term urgent time and long-term important time. Only a judgment-primary job in a stable stage uses 1 to 2 hours and about 6 hours as a reference. Inside the long-term hours, run a personal standards cycle of reflection, summary, restatement, verification, and return.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d7a25"/>
    </marker>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="520" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0a0a0a">Locate first, then match the mix, then run the cycle</text>
    <rect x="40" y="72" width="270" height="126" rx="10" fill="#f5f7f5" stroke="#b8c0ba" stroke-width="1.5"/>
    <text x="60" y="102" font-size="15" font-weight="700" fill="#0a0a0a">1  Locate the org stage / 10</text>
    <text x="60" y="132" font-size="13" fill="#4f5852">Survival: cash, delivery, and safety first</text>
    <text x="60" y="157" font-size="13" fill="#4f5852">Growth: current results and capability together</text>
    <text x="60" y="182" font-size="13" fill="#4f5852">Stable: enlarge the long-term judgment hours</text>
    <line x1="310" y1="135" x2="372" y2="135" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="385" y="72" width="270" height="126" rx="10" fill="#f5f7f5" stroke="#b8c0ba" stroke-width="1.5"/>
    <text x="405" y="102" font-size="15" font-weight="700" fill="#0a0a0a">2  Locate the job's main task / 10</text>
    <text x="405" y="132" font-size="13" fill="#4f5852">Delivery: finish promised results steadily</text>
    <text x="405" y="157" font-size="13" fill="#4f5852">Coordination: keep dependencies and promises moving</text>
    <text x="405" y="182" font-size="13" fill="#4f5852">Judgment: trade-offs, exceptions, and the later bill</text>
    <line x1="655" y1="135" x2="717" y2="135" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="72" width="270" height="126" rx="10" fill="#f5f7f5" stroke="#b8c0ba" stroke-width="1.5"/>
    <text x="750" y="102" font-size="15" font-weight="700" fill="#0a0a0a">3  Match the calendar / 80</text>
    <text x="750" y="132" font-size="13" fill="#4f5852">Short-term urgent: keep today running</text>
    <text x="750" y="157" font-size="13" fill="#4f5852">Long-term important: raise future capability</text>
    <text x="750" y="182" font-size="13" fill="#4f5852">When stage or job changes, the mix changes</text>
    <rect x="80" y="235" width="880" height="46" rx="9" fill="#eaf3e8" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="520" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#245f1f">Stable stage x judgment-primary x enough calendar autonomy: 1-2 / 6 as a reference mix</text>
    <rect x="130" y="310" width="190" height="70" rx="8" fill="#eef0ee" stroke="#b8c0ba" stroke-width="1.4"/>
    <text x="225" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a">1-2 hours a day</text>
    <text x="225" y="363" text-anchor="middle" font-size="12" fill="#4f5852">Current cash, delivery, and safety</text>
    <rect x="340" y="310" width="570" height="70" rx="8" fill="#eaf3e8" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="625" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#245f1f">About 6 hours, long-term important</text>
    <text x="625" y="363" text-anchor="middle" font-size="12" fill="#4f5852">Judge / write / develop people / learn / recover; not six hours of peak thinking</text>
    <text x="520" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">Personal standards cycle inside the long-term hours</text>
    <line x1="126" y1="462" x2="916" y2="462" stroke="#2d7a25" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="145" cy="462" r="6" fill="#2d7a25"/>
    <text x="145" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Experience / result</text>
    <text x="145" y="516" text-anchor="middle" font-size="11" fill="#59615a">Input from reality</text>
    <circle cx="310" cy="462" r="6" fill="#2d7a25"/>
    <text x="310" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Reflection</text>
    <text x="310" y="516" text-anchor="middle" font-size="11" fill="#59615a">Gap / revision / hypothesis / action</text>
    <circle cx="475" cy="462" r="6" fill="#2d7a25"/>
    <text x="475" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Candidate queue</text>
    <text x="475" y="516" text-anchor="middle" font-size="11" fill="#59615a">Dedup, conditions, evidence state</text>
    <circle cx="640" cy="462" r="6" fill="#2d7a25"/>
    <text x="640" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Summary</text>
    <text x="640" y="516" text-anchor="middle" font-size="11" fill="#59615a">Say it in ordinary language</text>
    <circle cx="805" cy="462" r="6" fill="#2d7a25"/>
    <text x="805" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Restate and verify</text>
    <text x="805" y="516" text-anchor="middle" font-size="11" fill="#59615a">Feedback enters the next round</text>
    <text x="520" y="548" text-anchor="middle" font-size="11" fill="#59615a">10/10/80 is where locating and matching get the weight of resource; 1-2/6 is a calendar reference for a given stage and job. Do not mix the two.</text>
  </g>
</svg>

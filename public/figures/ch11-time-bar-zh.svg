<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img">
  <rect width="860" height="300" fill="#fff"/>
  <text x="430" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">时间条倒置：钱 vs 价值</text>
  <text x="90" y="95" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#59615a">新配比</text>
  <rect x="110" y="70" width="120" height="44" fill="#d5dbd6"/>
  <text x="170" y="97" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#0a0a0a">1–2h 钱</text>
  <rect x="240" y="70" width="480" height="44" fill="#2d7a25" fill-opacity="0.22" stroke="#2d7a25" stroke-width="2"/>
  <text x="480" y="97" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2d7a25">6h 价值</text>
  <text x="90" y="185" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#59615a">旧现状</text>
  <rect x="110" y="160" width="520" height="44" fill="#ffb347" fill-opacity="0.35" stroke="#d5dbd6"/>
  <text x="370" y="187" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#0a0a0a">~7h 救火</text>
  <rect x="640" y="160" width="80" height="44" fill="#d5dbd6"/>
  <text x="680" y="187" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#59615a">1h 想</text>
  <text x="430" y="250" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#59615a">转型 = 把下面那根翻成上面那根</text>
  <text x="430" y="280" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#59615a">思考必须有产出物</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
  <title id="title">Six standard tiers on a normal distribution</title>
  <desc id="desc">A bell curve thick in the middle and thin at the tails; six standard tiers from left scarce/expensive to right mature/cheap; Path A crosses left to right, Path B reverse-iterates right to left.</desc>
  <defs>
    <linearGradient id="bandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7a25" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2d7a25" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="880" height="460" fill="#ffffff"/>

  <g stroke="#d5dbd6" stroke-width="1">
    <line x1="80" y1="48" x2="80" y2="300"/>
    <line x1="200" y1="48" x2="200" y2="300"/>
    <line x1="320" y1="48" x2="320" y2="300"/>
    <line x1="440" y1="48" x2="440" y2="300"/>
    <line x1="560" y1="48" x2="560" y2="300"/>
    <line x1="680" y1="48" x2="680" y2="300"/>
    <line x1="800" y1="48" x2="800" y2="300"/>
  </g>
  <rect x="80" y="48" width="720" height="252" fill="url(#bandFill)"/>

  <line x1="80" y1="300" x2="800" y2="300" stroke="#0a0a0a" stroke-width="1.75"/>

  <path
    d="M80,298 C120,296 150,280 200,240 C250,185 290,95 440,70 C590,95 630,185 680,240 C730,280 760,296 800,298"
    fill="none"
    stroke="#2d7a25"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M80,298 C120,296 150,280 200,240 C250,185 290,95 440,70 C590,95 630,185 680,240 C730,280 760,296 800,298 L800,300 L80,300 Z"
    fill="#6bed4a"
    fill-opacity="0.18"
  />

  <circle cx="440" cy="70" r="4.5" fill="#2d7a25"/>
  <text x="440" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#59615a">Thick middle</text>
  <text x="120" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#59615a">Thin tail · scarce standards</text>
  <text x="760" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#59615a">Thin tail · mature consensus</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0a0a0a" text-anchor="middle">
    <text x="140" y="322">Elite</text>
    <text x="260" y="322">High</text>
    <text x="380" y="322">Upper-mid</text>
    <text x="500" y="322">Mid</text>
    <text x="620" y="322">Lower-mid</text>
    <text x="740" y="322">Mature</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#59615a" text-anchor="middle">
    <text x="140" y="340">Innovators</text>
    <text x="260" y="340">Early adopters</text>
    <text x="380" y="340">Early majority</text>
    <text x="500" y="340">Early to late</text>
    <text x="620" y="340">Late majority</text>
    <text x="740" y="340">Laggards</text>
  </g>

  <text x="80" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Left: most expensive standards</text>
  <text x="800" y="368" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59615a">Right: cheapest mature consensus</text>

  <g>
    <line x1="150" y1="400" x2="700" y2="400" stroke="#0a0a0a" stroke-width="2"/>
    <polygon points="700,400 684,393 684,407" fill="#0a0a0a"/>
    <text x="425" y="392" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0a0a0a">Path A · Traditional (cross the chasm)</text>
  </g>

  <g>
    <line x1="700" y1="430" x2="150" y2="430" stroke="#2d7a25" stroke-width="2.5"/>
    <polygon points="150,430 166,423 166,437" fill="#2d7a25"/>
    <text x="425" y="452" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2d7a25">Path B · Reverse iteration (swap rulers tier by tier)</text>
  </g>
</svg>

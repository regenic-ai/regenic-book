<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage product path of consensus reverse iteration</title>
  <desc id="desc">A product team enters from a mature problem consensus, then verifies a survival product, a complete product, an advantage product, and a frontier product. What is reversed is the order in which the team widens the radius of innovation, not the law of user adoption. A product may stop at any stage.</desc>
  <rect width="1040" height="430" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="520" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#0a0a0a">The team widens the radius of innovation in stages</text>
    <text x="520" y="68" text-anchor="middle" font-size="13" fill="#59615a">The building order is reversed; the law of user adoption is not. Any stop can be a long-term end.</text>
    <rect x="40" y="112" width="168" height="112" rx="10" fill="#eef6ec" stroke="#2d7a25" stroke-width="2"/>
    <text x="124" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Mature consensus</text>
    <text x="124" y="181" text-anchor="middle" font-size="11" fill="#59615a">Problem already has behavior and pay</text>
    <rect x="238" y="112" width="168" height="112" rx="10" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
    <text x="322" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Survival product</text>
    <text x="322" y="181" text-anchor="middle" font-size="11" fill="#59615a">Pay / deliver / unit economics</text>
    <rect x="436" y="112" width="168" height="112" rx="10" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
    <text x="520" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Complete product</text>
    <text x="520" y="181" text-anchor="middle" font-size="11" fill="#59615a">Typical customers get the result alone</text>
    <rect x="634" y="112" width="168" height="112" rx="10" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
    <text x="718" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Advantage product</text>
    <text x="718" y="181" text-anchor="middle" font-size="11" fill="#59615a">The difference can be repeated</text>
    <rect x="832" y="112" width="168" height="112" rx="10" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
    <text x="916" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Frontier product</text>
    <text x="916" y="181" text-anchor="middle" font-size="11" fill="#59615a">New use with a budget and a stop</text>
    <g stroke="#2d7a25" stroke-width="2.5" fill="#2d7a25">
      <line x1="208" y1="168" x2="230" y2="168"/>
      <polygon points="230,168 220,162 220,174"/>
      <line x1="406" y1="168" x2="428" y2="168"/>
      <polygon points="428,168 418,162 418,174"/>
      <line x1="604" y1="168" x2="626" y2="168"/>
      <polygon points="626,168 616,162 616,174"/>
      <line x1="802" y1="168" x2="824" y2="168"/>
      <polygon points="824,168 814,162 814,174"/>
    </g>
    <g font-size="11" fill="#59615a" text-anchor="middle">
      <text x="223" y="99">Verify survival</text>
      <text x="421" y="99">Verify delivery</text>
      <text x="619" y="99">Verify difference</text>
      <text x="817" y="99">Verify a new use</text>
    </g>
    <rect x="40" y="274" width="960" height="92" rx="10" fill="#f4f6f4" stroke="#d5dbd6" stroke-width="1.5"/>
    <text x="520" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">R&amp;D rails</text>
    <text x="520" y="332" text-anchor="middle" font-size="12" fill="#59615a">Hold the stable core  |  Adjacent improvement adds one main uncertainty  |  Frontier exploration has a budget and a stop</text>
    <text x="520" y="352" text-anchor="middle" font-size="12" fill="#59615a">Results decide keep, upgrade, roll back, or stop  |  Each round writes the judgment back into a standard</text>
    <line x1="124" y1="390" x2="916" y2="390" stroke="#2d7a25" stroke-width="2"/>
    <g fill="#2d7a25">
      <circle cx="124" cy="390" r="5"/>
      <circle cx="322" cy="390" r="5"/>
      <circle cx="520" cy="390" r="5"/>
      <circle cx="718" cy="390" r="5"/>
      <circle cx="916" cy="390" r="5"/>
    </g>
    <text x="520" y="417" text-anchor="middle" font-size="12" fill="#2d7a25">The frontier is not a rank. Stopping is not a failure.</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Judging a relationship: duty first, then locate, then match and choose</title>
  <desc id="desc">First check for deception, harm, coercion, breach, neglect of duty, or abuse of power. If a line has been crossed, turn to safety, accountability, performance, or legal process. If no clear line has been crossed, spend a little resource locating the other party, a little locating yourself, and most of the resource matching and choosing, then let results return. Customers, friends, and family are bound by different duties.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7a25"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a4c00"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#0a0a0a">Duty first, then locate, then match and choose</text>
    <text x="560" y="64" text-anchor="middle" font-size="13" fill="#59615a">Stage is a working judgment that can be revised. It is not a rank, and not an exemption from duty.</text>
    <rect x="52" y="94" width="1016" height="72" rx="12" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
    <text x="560" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Conditions of duty and power</text>
    <text x="560" y="147" text-anchor="middle" font-size="13" fill="#59615a">Is there deception, harm, coercion, breach, neglect of duty, or a clear abuse of power?</text>
    <line x1="310" y1="166" x2="310" y2="202" stroke="#9a4c00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <text x="286" y="188" text-anchor="end" font-size="12" fill="#9a4c00">Yes</text>
    <rect x="90" y="210" width="440" height="76" rx="12" fill="#fff7ef" stroke="#d69b62" stroke-width="1.5"/>
    <text x="310" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#7d3d00">Handle facts and duty first</text>
    <text x="310" y="265" text-anchor="middle" font-size="12.5" fill="#7d3d00">Safety / accountability / performance / mediation or law</text>
    <line x1="760" y1="166" x2="760" y2="202" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="782" y="188" font-size="12" fill="#2d7a25">No clear crossing</text>
    <rect x="570" y="210" width="178" height="76" rx="12" fill="#eef6ec" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="659" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Locate them / 10</text>
    <text x="659" y="264" text-anchor="middle" font-size="12" fill="#59615a">Repeated behavior, not guessed interiors</text>
    <line x1="748" y1="248" x2="786" y2="248" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="794" y="210" width="178" height="76" rx="12" fill="#eef6ec" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="883" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">Locate yourself / 10</text>
    <text x="883" y="264" text-anchor="middle" font-size="12" fill="#59615a">Position / floor / duties that cannot shift</text>
    <line x1="883" y1="286" x2="883" y2="322" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="560" y="330" width="424" height="94" rx="12" fill="#f5fff2" stroke="#2d7a25" stroke-width="2"/>
    <text x="772" y="359" text-anchor="middle" font-size="16" font-weight="600" fill="#0a0a0a">Match and choose / 80</text>
    <text x="772" y="387" text-anchor="middle" font-size="13" fill="#2d7a25">Screen / match    communicate / negotiate    adjust the boundary</text>
    <text x="772" y="410" text-anchor="middle" font-size="13" fill="#2d7a25">Layered coexistence    exit after remaining duties</text>
    <path d="M 984 376 C 1054 376, 1054 222, 980 222" fill="none" stroke="#2d7a25" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
    <text x="1052" y="304" text-anchor="middle" transform="rotate(-90 1052 304)" font-size="12" fill="#2d7a25">Results return; locate again</text>
    <text x="560" y="461" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Same order of judgment, different duties</text>
    <rect x="70" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="220" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">Customer</text>
    <text x="220" y="524" text-anchor="middle" font-size="12" fill="#59615a">Contract / delivery / payment / exit terms</text>
    <rect x="410" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="560" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">Friend</text>
    <text x="560" y="524" text-anchor="middle" font-size="12" fill="#59615a">Voluntary / promise / privacy / shared work</text>
    <rect x="750" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="900" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">Family</text>
    <text x="900" y="524" text-anchor="middle" font-size="12" fill="#59615a">Care / property / children / continuing duty</text>
  </g>
</svg>

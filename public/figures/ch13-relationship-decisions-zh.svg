<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">关系判断：先履责，再定位，最后匹配与取舍</title>
  <desc id="desc">先检查是否存在欺骗、伤害、胁迫、违约、失责或权力滥用。有越线行为时转入安全、追责、履约或法律处理；没有明显越线时，按定位对方百分之十、定位自己百分之十、匹配与取舍百分之八十行动，再让结果回流。客户、朋友和家庭受不同责任约束。</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7a25"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a4c00"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#0a0a0a">先履责，再定位，最后匹配与取舍</text>
  <text x="560" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#59615a">阶段是可修订的工作判断，不是人的等级，也不是责任豁免</text>

  <rect x="52" y="94" width="1016" height="72" rx="12" fill="#f7faf6" stroke="#b7c7b7" stroke-width="1.5"/>
  <text x="560" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">责任与权力条件</text>
  <text x="560" y="147" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#59615a">是否存在欺骗、伤害、胁迫、违约、失责或明显权力滥用？</text>

  <line x1="310" y1="166" x2="310" y2="202" stroke="#9a4c00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="286" y="188" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9a4c00">有</text>
  <rect x="90" y="210" width="440" height="76" rx="12" fill="#fff7ef" stroke="#d69b62" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#7d3d00">先处理事实与责任</text>
  <text x="310" y="265" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#7d3d00">安全 · 追责 · 履约 · 调解或法律程序</text>

  <line x1="760" y1="166" x2="760" y2="202" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="782" y="188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2d7a25">无明显越线</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="570" y="210" width="178" height="76" rx="12" fill="#eef6ec" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="659" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">定位对方 10</text>
    <text x="659" y="264" text-anchor="middle" font-size="12" fill="#59615a">看反复行为，不猜内心</text>
    <line x1="748" y1="248" x2="786" y2="248" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="794" y="210" width="178" height="76" rx="12" fill="#eef6ec" stroke="#2d7a25" stroke-width="1.8"/>
    <text x="883" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="#0a0a0a">定位自己 10</text>
    <text x="883" y="264" text-anchor="middle" font-size="12" fill="#59615a">位置 · 底线 · 不可转嫁责任</text>
  </g>

  <line x1="883" y1="286" x2="883" y2="322" stroke="#2d7a25" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="560" y="330" width="424" height="94" rx="12" fill="#f5fff2" stroke="#2d7a25" stroke-width="2"/>
  <text x="772" y="359" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a">匹配与取舍 80</text>
  <text x="772" y="387" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2d7a25">筛选/匹配　沟通/协商　调整边界</text>
  <text x="772" y="410" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2d7a25">分层相处　履责后退出</text>

  <path d="M 984 376 C 1054 376, 1054 222, 980 222" fill="none" stroke="#2d7a25" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <text x="1052" y="304" text-anchor="middle" transform="rotate(-90 1052 304)" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2d7a25">结果回流，重新定位</text>

  <text x="560" y="461" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">同一判断顺序，不同责任</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="70" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="220" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">客户</text>
    <text x="220" y="524" text-anchor="middle" font-size="12" fill="#59615a">合同 · 交付 · 付款 · 退出条款</text>
    <rect x="410" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="560" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">朋友</text>
    <text x="560" y="524" text-anchor="middle" font-size="12" fill="#59615a">自愿 · 承诺 · 隐私 · 共同项目</text>
    <rect x="750" y="480" width="300" height="56" rx="10" fill="#f7faf6" stroke="#b7c7b7"/>
    <text x="900" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0a0a">家人</text>
    <text x="900" y="524" text-anchor="middle" font-size="12" fill="#59615a">照护 · 财产 · 子女 · 持续义务</text>
  </g>
</svg>

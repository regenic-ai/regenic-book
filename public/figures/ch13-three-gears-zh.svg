<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">三次蜕变：齿轮怎么换</title>
  <desc id="desc">知我：自己的齿开始从别人的规格上剥下来。立身：齿形落到一件事上，对外开始说不。结伴：找能咬合的同行，对不上的不改对方的齿。</desc>
  <rect width="960" height="460" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a">三次蜕变：齿轮怎么换</text>
  <text x="480" y="56" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#59615a">每一次对内换一把尺子，对外就换一批能咬合的齿轮；同时舍弃一样旧活法</text>

  <rect x="28" y="78" width="288" height="300" rx="14" fill="#ffffff" stroke="#d5dbd6"/>
  <text x="172" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">一 · 知我</text>
  <text x="172" y="128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">期待从外收回</text>

  <g transform="translate(88,210)" opacity="0.35">
    <circle r="28" fill="#ffffff" stroke="#8a4300" stroke-width="5"/>
    <circle r="7" fill="#8a4300"/>
    <g fill="#8a4300">
      <rect x="-4" y="-38" width="8" height="10" rx="1"/>
      <rect x="-4" y="28" width="8" height="10" rx="1"/>
      <rect x="-38" y="-4" width="10" height="8" rx="1"/>
      <rect x="28" y="-4" width="10" height="8" rx="1"/>
    </g>
  </g>
  <g transform="translate(248,178)" opacity="0.28">
    <circle r="22" fill="#ffffff" stroke="#8a4300" stroke-width="4"/>
    <circle r="6" fill="#8a4300"/>
  </g>
  <g transform="translate(252,248)" opacity="0.22">
    <circle r="18" fill="#ffffff" stroke="#8a4300" stroke-width="4"/>
    <circle r="5" fill="#8a4300"/>
  </g>
  <g transform="translate(172,220)">
    <circle r="46" fill="#ffffff" stroke="#2d7a25" stroke-width="8"/>
    <circle r="12" fill="#2d7a25"/>
    <g fill="#2d7a25">
      <rect x="-7" y="-62" width="14" height="16" rx="2"/>
      <rect x="-7" y="46" width="14" height="16" rx="2" opacity="0.45"/>
      <rect x="-62" y="-7" width="16" height="14" rx="2"/>
      <rect x="46" y="-7" width="16" height="14" rx="2" opacity="0.45"/>
    </g>
  </g>
  <text x="172" y="318" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2d7a25">自己的齿开始成型</text>
  <text x="172" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">舍弃：拿别人的期待排序</text>
  <text x="172" y="356" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8a4300">旧圈子开始淡</text>

  <path d="M324,220 L348,220" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
  <path d="M342,214 L352,220 L342,226" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>

  <rect x="336" y="78" width="288" height="300" rx="14" fill="#f5fff2" stroke="#d5dbd6"/>
  <text x="480" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">二 · 立身</text>
  <text x="480" y="128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">这件事进入排序</text>

  <g transform="translate(440,220)">
    <circle r="48" fill="#ffffff" stroke="#2d7a25" stroke-width="9"/>
    <circle r="13" fill="#2d7a25"/>
    <g fill="#2d7a25">
      <rect x="-8" y="-66" width="16" height="18" rx="2"/>
      <rect x="-8" y="48" width="16" height="18" rx="2"/>
      <rect x="-66" y="-8" width="18" height="16" rx="2"/>
      <rect x="48" y="-8" width="18" height="16" rx="2"/>
    </g>
  </g>
  <g transform="translate(545,188)">
    <circle r="26" fill="#ffffff" stroke="#2d7a25" stroke-width="6"/>
    <circle r="8" fill="#2d7a25"/>
    <g fill="#2d7a25">
      <rect x="-4" y="-36" width="8" height="10" rx="1"/>
      <rect x="-4" y="26" width="8" height="10" rx="1"/>
      <rect x="-36" y="-4" width="10" height="8" rx="1"/>
      <rect x="26" y="-4" width="10" height="8" rx="1"/>
    </g>
  </g>
  <g transform="translate(560,268)" opacity="0.55">
    <circle r="20" fill="#ffffff" stroke="#8a4300" stroke-width="4"/>
    <circle r="6" fill="#8a4300"/>
  </g>
  <path d="M548,256 L572,280 M572,256 L548,280" stroke="#8a4300" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2d7a25">齿形定住 · 能说不</text>
  <text x="480" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">舍弃：门门都开着</text>
  <text x="480" y="356" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8a4300">对不上的单子看见了</text>

  <path d="M632,220 L656,220" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
  <path d="M650,214 L660,220 L650,226" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>

  <rect x="644" y="78" width="288" height="300" rx="14" fill="#ffffff" stroke="#b8f3a6"/>
  <text x="788" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">三 · 结伴</text>
  <text x="788" y="128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">不改人，只同行</text>

  <g transform="translate(738,210)">
    <circle r="42" fill="#ffffff" stroke="#2d7a25" stroke-width="8"/>
    <circle r="11" fill="#2d7a25"/>
    <g fill="#2d7a25">
      <rect x="-7" y="-58" width="14" height="16" rx="2"/>
      <rect x="-7" y="42" width="14" height="16" rx="2"/>
      <rect x="-58" y="-7" width="16" height="14" rx="2"/>
      <rect x="42" y="-7" width="16" height="14" rx="2"/>
    </g>
  </g>
  <g transform="translate(848,210)">
    <circle r="42" fill="#ffffff" stroke="#2d7a25" stroke-width="8"/>
    <circle r="11" fill="#2d7a25"/>
    <g fill="#2d7a25">
      <rect x="-7" y="-58" width="14" height="16" rx="2"/>
      <rect x="-7" y="42" width="14" height="16" rx="2"/>
      <rect x="-58" y="-7" width="16" height="14" rx="2"/>
      <rect x="42" y="-7" width="16" height="14" rx="2"/>
    </g>
  </g>
  <g transform="translate(788,300)" opacity="0.4">
    <circle r="16" fill="#ffffff" stroke="#8a4300" stroke-width="3"/>
    <circle r="5" fill="#8a4300"/>
  </g>
  <path d="M788,258 L788,280" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="788" y="330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2d7a25">同频咬合 · 不同频不改齿</text>
  <text x="788" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">舍弃：把沟通当经营</text>
  <text x="788" y="368" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8a4300">理解 · 兼容 · 慈悲</text>

  <text x="480" y="420" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#59615a">自述三次 · 不可外推 · 结伴不是渡人</text>
  <text x="480" y="442" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#59615a">绿 = 自己的规格 / 能咬合　　橙 = 淡去、对不上、或兼容而不改</text>
</svg>
